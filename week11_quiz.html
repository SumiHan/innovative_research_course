let studentName = "";
let current = 0;
let correctCount = 0;
let answered = 0;
const selectedAnswers = new Array(questions.length).fill(null);
const letters = ["A", "B", "C", "D"];

// ── 시작 ──
document.getElementById("startBtn").addEventListener("click", startQuiz);
document.getElementById("nameInput").addEventListener("keydown", function(e){
  if (e.key === "Enter") startQuiz();
});

function startQuiz() {
  const v = document.getElementById("nameInput").value.trim();
  if (!v) { document.getElementById("nameInput").focus(); return; }
  studentName = v;
  document.getElementById("nameOverlay").classList.add("hidden");
  document.getElementById("hello").textContent = studentName + "님, 화이팅! 한 문항씩 풀어보세요.";
  renderQuiz();
}

function renderQuiz() {
  const area = document.getElementById("quizArea");
  let html = "";
  let lastSection = "";
  questions.forEach((q, i) => {
    if (q.section !== lastSection) {
      html += `<div class="section-title">${q.section}</div>`;
      lastSection = q.section;
    }
    const scopeTag = q.scope === "local"
      ? `<span class="tag local">📍 강원·춘천</span>`
      : `<span class="tag global">🌐 글로벌</span>`;
    let optsHtml = "";
    q.opts.forEach((o, j) => {
      optsHtml += `<div class="opt" data-q="${i}" data-o="${j}">
        <span class="letter">${letters[j]}</span><span>${o}</span></div>`;
    });
    html += `<div class="q-card" id="card-${i}">
      <div class="q-meta">
        <span class="tag role">💼 ${q.role}</span>${scopeTag}
      </div>
      <div class="q-scenario">${q.scenario}</div>
      <div class="q-text"><span class="q-num">Q${i+1}.</span>${q.text}</div>
      <div class="opts">${optsHtml}</div>
      <div class="explain" id="explain-${i}"><b>해설</b> · ${q.explain}</div>
    </div>`;
  });
  area.innerHTML = html;
  area.querySelectorAll(".opt").forEach(el => el.addEventListener("click", onSelect));
  updateProgress();
}

function onSelect(e) {
  const el = e.currentTarget;
  const qi = +el.dataset.q;
  const oi = +el.dataset.o;
  if (selectedAnswers[qi] !== null) return; // 이미 답함

  selectedAnswers[qi] = oi;
  answered++;
  const correct = questions[qi].answer;
  const card = document.getElementById("card-" + qi);
  const opts = card.querySelectorAll(".opt");

  opts.forEach((o, j) => {
    o.classList.add("disabled");
    if (j === correct) o.classList.add("correct");
    if (j === oi && oi !== correct) o.classList.add("wrong");
  });

  if (oi === correct) correctCount++;
  document.getElementById("explain-" + qi).classList.add("show");
  updateProgress();

  if (answered === questions.length) showResult();
}

function updateProgress() {
  const pct = Math.round((answered / questions.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = answered + " / " + questions.length + " 문항";
  document.getElementById("scoreLabel").textContent = "정답 " + correctCount + "개";
}

function showResult() {
  const pct = Math.round((correctCount / questions.length) * 100);
  let grade, color, msg;
  if (pct >= 90)      { grade = "S"; color = "#6c5ce7"; msg = "완벽합니다! 추론통계의 논리를 정확히 잡았어요."; }
  else if (pct >= 80) { grade = "A"; color = "#1b9e5a"; msg = "훌륭해요! 검정 선택과 해석을 잘 이해하고 있습니다."; }
  else if (pct >= 70) { grade = "B"; color = "#2980b9"; msg = "좋아요. 헷갈린 부분의 해설을 한 번 더 읽어보세요."; }
  else if (pct >= 60) { grade = "C"; color = "#e67e22"; msg = "기본은 잡았어요. 가설검정 6단계를 복습해 봅시다."; }
  else                { grade = "복습"; color = "#e74c3c"; msg = "괜찮아요! 강의 슬라이드와 해설을 다시 보고 재도전해요."; }

  const gradeText = (grade === "복습") ? "복습" : grade + "등급";
  const r = document.getElementById("result");
  document.getElementById("gradeBadge").textContent = grade;
  document.getElementById("gradeBadge").style.color = color;
  document.getElementById("resultScore").textContent =
    questions.length + "문항 중 " + correctCount + "개 정답 (" + pct + "%)";
  document.getElementById("resultMsg").textContent = msg;
  r.classList.add("show");
  r.scrollIntoView({ behavior: "smooth" });

  submitResult(pct, gradeText);
}

function submitResult(pct, grade) {
  const s = document.getElementById("saveStatus");
  s.className = "save-status saving";
  s.textContent = "⏳ 결과 저장 중...";

  const sel = selectedAnswers.join(",");
  const cor = questions.map(q => q.answer).join(",");
  const qtexts = questions.map(q => q.text.replace(/,/g, " ").substring(0, 30)).join("|");
  const optexts = questions.map((q, i) => {
    const idx = selectedAnswers[i];
    return (idx !== null && idx >= 0) ? q.opts[idx].replace(/,/g, " ").substring(0, 20) : "-";
  }).join("|");

  const params = "?name="    + encodeURIComponent(studentName)
               + "&week="    + encodeURIComponent(WEEK_ID)
               + "&correct=" + correctCount
               + "&total="   + questions.length
               + "&pct="     + pct
               + "&grade="   + encodeURIComponent(grade)
               + "&sel="     + encodeURIComponent(sel)
               + "&cor="     + encodeURIComponent(cor)
               + "&qtexts="  + encodeURIComponent(qtexts)
               + "&optexts=" + encodeURIComponent(optexts);

  fetch(SCRIPT_URL + params, { method: "GET", mode: "no-cors" })
    .then(() => {
      s.className = "save-status saved";
      s.textContent = "✅ " + studentName + "님의 결과가 저장되었습니다.";
    })
    .catch(() => {
      s.className = "save-status save-err";
      s.textContent = "❌ 저장 실패. 결과를 스크린샷으로 저장해 주세요.";
    });
}
