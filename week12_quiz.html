<html lang="ko">
<head>

<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    margin: 0; padding: 30px 16px; color: #2c3e50; line-height: 1.6; min-height: 100vh;
  }
  main { max-width: 820px; margin: 0 auto; }
  .header {
    background: #fff; border-radius: 16px; padding: 30px 32px; margin-bottom: 22px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06); text-align: center;
  }
  .course-tag {
    display: inline-block; background: #6c5ce7; color: #fff; padding: 4px 14px;

  /* 이름 입력 오버레이 */

    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .overlay-card {
    background: #fff; border-radius: 16px; padding: 34px 30px; width: 90%; max-width: 380px;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  }
  .overlay-card h2 { margin: 0 0 6px; font-size: 20px; color: #6c5ce7; }
  .overlay-card p { font-size: 13.5px; color: #7f8c8d; margin: 0 0 18px; }
  .overlay-card input {
    width: 100%; padding: 12px 14px; font-size: 15px; border: 2px solid #dfe6f3;
    border-radius: 10px; margin-bottom: 14px; font-family: inherit;
  }
  .overlay-card input:focus { outline: none; border-color: #6c5ce7; }
  .btn {
    background: #6c5ce7; color: #fff; border: none; padding: 12px 22px; font-size: 15px;
    font-weight: 700; border-radius: 10px; cursor: pointer; font-family: inherit; transition: .15s;
  }
  .btn:hover { background: #5a4bd1; }
  .btn:disabled { background: #c5c0ea; cursor: not-allowed; }

  /* 진행바 */
  .progress-wrap {
    background: #fff; border-radius: 12px; padding: 14px 18px; margin-bottom: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 14px;
  }
  .progress-bar { flex: 1; height: 10px; background: #eef1f8; border-radius: 6px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #6c5ce7; transition: width .3s; }
  .progress-text { font-size: 13px; font-weight: 700; color: #6c5ce7; white-space: nowrap; }

  .section-title {
    font-size: 15px; color: #6c5ce7; font-weight: 700; margin: 24px 0 12px 2px;
    padding-left: 10px; border-left: 4px solid #6c5ce7;
  }
  .card {
    background: #fff; border-radius: 12px; padding: 22px 24px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  }
  .q-head { display: flex; gap: 10px; margin-bottom: 6px; }
  .q-num {
    background: #6c5ce7; color: #fff; width: 26px; height: 26px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0;
  }
  .q-role { font-size: 11.5px; color: #6c5ce7; background: #f0eefc; padding: 2px 9px; border-radius: 10px; align-self: center; }
  .q-text { font-size: 15px; font-weight: 600; margin: 8px 0 14px; }
  .opt {
    display: block; width: 100%; text-align: left; background: #f8f9fc; border: 2px solid #eef1f8;
    border-radius: 9px; padding: 12px 14px; margin-bottom: 9px; font-size: 14px; cursor: pointer;
    font-family: inherit; color: #2c3e50; transition: .12s;
  }
  .opt:hover:not(:disabled) { border-color: #c9c2f3; background: #f3f1fd; }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: #27ae60; background: #eafaf1; font-weight: 700; }
  .opt.wrong { border-color: #e74c3c; background: #fdeeec; }
  .opt-label { font-weight: 700; margin-right: 8px; }
  .exp {
    display: none; margin-top: 10px; padding: 12px 14px; background: #f4f6fb;
    border-left: 3px solid #6c5ce7; border-radius: 6px; font-size: 13.5px; color: #34495e;
  }
  .exp.show { display: block; }

  .result {
    display: none; background: #fff; border-radius: 16px; padding: 32px 28px; text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08); margin-top: 8px;
  }
  .result.show { display: block; }
  .result .score { font-size: 44px; font-weight: 800; color: #6c5ce7; }
  .result .grade { font-size: 22px; font-weight: 800; margin: 4px 0 10px; }
  .result .msg { color: #7f8c8d; font-size: 14px; }
  .submit-note { font-size: 12px; color: #aaa; margin-top: 14px; }
  .footer { text-align: center; margin-top: 30px; color: #888; font-size: 12px; }
</style>
</head>

<main>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7fcaTl9AdRyHKda_WP8k6UvVmi0exEHn8_QjkG6tHc6Uk3yA97IqUy2nJqTatHoSrOA/exec";
const WEEK_ID = "Week12";

const QUESTIONS = [
  // ── 섹션 1: 검정의 출발점 — 데이터 유형과 가정 점검 ──
  { sec: "① 검정의 출발점 — 데이터 유형과 가정 점검",
    role: "데이터 분석가 · 글로벌",
    label: "종속변수 유형",
    q: "글로벌 이커머스 회사의 데이터 분석가가 '프리미엄 회원과 일반 회원의 월 평균 구매액(원)에 차이가 있는가'를 분석하려 합니다. 종속변수의 성격과 적절한 접근은?",
    opts: [
      "연속형(월 평균 구매액)이므로 두 집단의 평균 비교 → t-test",
      "범주형이므로 카이제곱(χ²) 검정",
      "서열형이므로 빈도분석만 가능",
      "명목형이므로 상관분석"
    ], ans: 0,
    exp: "구매액(원)은 연속형 수치이고 비교 대상은 서로 다른 두 집단의 평균입니다. → 독립표본 t-test가 출발점."
  },
  { sec: "① 검정의 출발점 — 데이터 유형과 가정 점검",
    role: "정책기획자 · 춘천",
    label: "정규성 검정",
    q: "춘천시 정책기획자가 두 동(洞) 주민의 정책 만족도(점수) 평균 차이를 t-test로 보기 전에 Shapiro-Wilk 검정을 했더니 p = .01이었습니다. 올바른 대응은?",
    opts: [
      "정규성을 만족하므로 그대로 t-test를 진행한다",
      "p가 작으니 표본을 더 모아야 한다",
      "범주형 자료이므로 카이제곱으로 바꾼다",
      "정규성 위반(p < .05)이므로 Mann-Whitney U 검정을 고려한다"
    ], ans: 3,
    exp: "Shapiro-Wilk의 H0는 '정규분포를 따른다'. p < .05면 정규성 위반 → 비모수 대안인 Mann-Whitney U로 분기."
  },
  { sec: "① 검정의 출발점 — 데이터 유형과 가정 점검",
    role: "스타트업 창업자 · 글로벌",
    label: "표본크기·중심극한정리",
    q: "스타트업 창업자가 두 국가 사용자 그룹(각 n=150)의 앱 일일 체류시간 평균을 비교합니다. 표본 크기와 검정 선택에 대한 설명으로 옳은 것은?",
    opts: [
      "표본이 크면 무조건 카이제곱을 써야 한다",
      "표본이 크면 비모수 검정만 사용해야 한다",
      "표본이 충분히 크면(n ≥ 30) 중심극한정리에 따라 평균 비교에 t-test를 무리 없이 쓸 수 있다",
      "표본 크기는 검정 방법 선택과 아무 관련이 없다"
    ], ans: 2,
    exp: "n이 충분히 크면 표본평균 분포가 정규에 가까워져(중심극한정리) t-test의 정규성 부담이 완화됩니다."
  },
  { sec: "① 검정의 출발점 — 데이터 유형과 가정 점검",
    role: "UX 디자이너 · 춘천",
    label: "두 범주형 변수",
    q: "춘천 로컬 앱의 UX 디자이너가 '성별(남/여)에 따라 다크모드 선택 비율이 다른가'를 보려 합니다. 두 변수 모두 범주형일 때 적절한 검정은?",
    opts: [
      "독립표본 t-test",
      "카이제곱(χ²) 검정",
      "대응표본 t-test",
      "Pearson 상관분석"
    ], ans: 1,
    exp: "두 변수 모두 범주형(성별 × 선택 여부)이면 평균이 아니라 비율·분포를 비교 → 카이제곱."
  },

  // ── 섹션 2: 독립표본 vs 대응표본 t-test ──
  { sec: "② 독립표본 vs 대응표본 t-test — 누가 측정되었나?",
    role: "마케터 · 글로벌",
    label: "대응표본 식별",
    q: "글로벌 브랜드 마케터가 '같은 고객 100명'에게 리브랜딩 전과 후의 브랜드 호감도 점수를 각각 측정해 비교합니다. 적절한 검정은?",
    opts: [
      "독립표본 t-test",
      "카이제곱 검정",
      "일원분산분석(ANOVA)",
      "대응표본 t-test (동일 고객의 전·후 비교)"
    ], ans: 3,
    exp: "같은 사람의 두 시점(전/후)을 짝지어 비교 → 대응표본 t-test. 개인 내 변화량을 봅니다."
  },
  { sec: "② 독립표본 vs 대응표본 t-test — 누가 측정되었나?",
    role: "데이터 분석가 · 강원",
    label: "독립표본 식별",
    q: "강원 관광 데이터 분석가가 '강릉 방문객'과 '속초 방문객'의 1인당 지출액을 비교합니다(서로 다른 사람들). 적절한 검정은?",
    opts: [
      "독립표본 t-test (서로 다른 두 집단의 평균 비교)",
      "대응표본 t-test",
      "카이제곱 검정",
      "Wilcoxon 부호순위 검정"
    ], ans: 0,
    exp: "강릉/속초는 서로 다른 두 집단이므로 집단 간 평균 비교 → 독립표본 t-test."
  },
  { sec: "② 독립표본 vs 대응표본 t-test — 누가 측정되었나?",
    role: "콘텐츠 기획자 · 글로벌",
    label: "핵심 판단 기준",
    q: "콘텐츠 기획자가 독립표본/대응표본 중 무엇을 쓸지 헷갈립니다. 두 검정을 가르는 가장 핵심적인 판단 기준은?",
    opts: [
      "표본 평균이 큰지 작은지",
      "p-value가 0.05보다 큰지 작은지",
      "측정 대상이 서로 다른 집단인지, 같은 집단의 두 시점인지",
      "종속변수가 몇 개인지"
    ], ans: 2,
    exp: "\"누가 측정되었는가?\" — 다른 사람들 → 독립표본, 같은 사람들(전/후·짝) → 대응표본."
  },
  { sec: "② 독립표본 vs 대응표본 t-test — 누가 측정되었나?",
    role: "정책기획자 · 춘천",
    label: "사전·사후 설계",
    q: "춘천시 정책기획자가 청년 창업교육에 참여한 '같은 20명'의 교육 전·후 자신감 점수 변화를 분석합니다. 적절한 검정은?",
    opts: [
      "독립표본 t-test",
      "대응표본 t-test (동일 20명의 전·후 비교)",
      "카이제곱 검정",
      "Mann-Whitney U 검정"
    ], ans: 1,
    exp: "동일 집단의 프로그램 전·후(짝지은 두 측정값) → 대응표본 t-test."
  },

  // ── 섹션 3: 카이제곱 검정 ──
  { sec: "③ 카이제곱 검정 — 비율·분포의 차이",
    role: "데이터 PM · 글로벌",
    label: "기대빈도 규칙",
    q: "글로벌 서비스 데이터 PM이 카이제곱 교차표를 만들었더니 여러 셀의 기대빈도가 5 미만이었습니다. 권장되는 조치는?",
    opts: [
      "그대로 카이제곱 결과를 신뢰한다",
      "p-value를 2배로 보정한다",
      "표본을 절반으로 줄인다",
      "범주를 적절히 묶거나 Fisher's Exact Test를 고려한다"
    ], ans: 3,
    exp: "기대빈도 5 미만 셀이 많으면 카이제곱 신뢰도 저하 → 범주 병합 또는 Fisher's Exact Test."
  },
  { sec: "③ 카이제곱 검정 — 비율·분포의 차이",
    role: "UX 디자이너 · 글로벌",
    label: "이진화 이유",
    q: "UX 디자이너가 5점 만족도(1~5)를 카이제곱에 넣으려고 만족(4~5)/불만족(1~3)으로 묶었습니다(이진화). 이렇게 하는 주된 이유는?",
    opts: [
      "범주가 너무 잘게 나뉘면 작은 빈도(5 미만) 셀이 많아져 검정 신뢰도가 떨어지기 때문",
      "평균을 더 정확히 계산하기 위해",
      "범주형을 연속형으로 바꾸기 위해",
      "전체 표본 크기를 늘리기 위해"
    ], ans: 0,
    exp: "이진화는 셀당 빈도를 키워 기대빈도 5 미만 문제를 줄이고 해석을 단순화하기 위한 조치입니다."
  },
  { sec: "③ 카이제곱 검정 — 비율·분포의 차이",
    role: "마케터 · 강원",
    label: "결과 해석(관련성)",
    q: "강원 지역축제 마케터가 '연령대에 따라 선호 굿즈 종류 비율이 다른가'를 카이제곱으로 분석해 χ²(3) = 12.5, p = .006을 얻었습니다. 올바른 해석은?",
    opts: [
      "연령대와 굿즈 선호는 서로 관련이 없다",
      "연령대가 굿즈 선호의 '원인'임이 증명되었다",
      "연령대에 따라 선호 굿즈 비율이 통계적으로 유의하게 다르다(관련 있음)",
      "표본이 너무 작아 해석할 수 없다"
    ], ans: 2,
    exp: "p < .05이므로 H0(관련 없음) 기각 → 연령대와 굿즈 선호는 관련이 있음. 단, 관련성이지 인과는 아님."
  },
  { sec: "③ 카이제곱 검정 — 비율·분포의 차이",
    role: "데이터 분석가 · 글로벌",
    label: "자유도",
    q: "'전공(2범주) × AI 사용수준(High/Low)' 2×2 교차표로 카이제곱 검정을 합니다. 이때 자유도(df)는?",
    opts: [
      "df = 0",
      "df = 1",
      "df = 2",
      "df = 4"
    ], ans: 1,
    exp: "df = (행 수 − 1) × (열 수 − 1) = (2−1)(2−1) = 1."
  },

  // ── 섹션 4: 결과 해석과 보고 ──
  { sec: "④ 결과 해석과 보고",
    role: "콘텐츠 기획자 · 글로벌",
    label: "p-value 해석",
    q: "글로벌 뉴스레터 기획자가 두 제목(A/B)의 클릭률 평균을 비교해 t = 2.4, p = .018을 얻었습니다. 유의수준 .05에서 올바른 해석은?",
    opts: [
      "p < .05이므로 두 제목의 클릭률 차이가 통계적으로 유의하다",
      "두 제목의 클릭률에 차이가 없다",
      "귀무가설이 참임이 증명되었다",
      "A가 B보다 정확히 1.8% 더 좋다는 뜻이다"
    ], ans: 0,
    exp: "p = .018 < .05 → H0 기각, 차이는 유의. p값은 '차이 크기(%)'나 '증명'이 아니라 H0 하에서의 관측 확률."
  },
  { sec: "④ 결과 해석과 보고",
    role: "데이터 분석가 · 춘천",
    label: "보고 통계치",
    q: "춘천 데이터 분석가가 정규성을 만족하는 독립표본 t-test 결과를 학술 형식으로 보고합니다. 함께 보고해야 할 통계치로 가장 적절한 것은?",
    opts: [
      "중앙값(Median)과 순위 정보",
      "최빈값만",
      "각 집단의 평균(M)과 표준편차(SD)",
      "기대빈도표만"
    ], ans: 2,
    exp: "모수적 검정(t-test)은 M·SD를 보고합니다. 비모수(Mann-Whitney)는 중앙값·순위 정보를 보고."
  },
  { sec: "④ 결과 해석과 보고",
    role: "스타트업 창업자 · 글로벌",
    label: "검정 선택 종합",
    q: "스타트업 창업자가 '구독 요금제(월간/연간)에 따라 해지 여부(이탈/유지) 비율이 다른가'를 보려 합니다. 두 변수 모두 범주형일 때 적절한 검정은?",
    opts: [
      "독립표본 t-test",
      "카이제곱(χ²) 검정",
      "대응표본 t-test",
      "Pearson 상관분석"
    ], ans: 1,
    exp: "요금제(범주) × 해지 여부(범주)의 비율 차이 → 카이제곱. 평균(연속형) 이야기가 아니므로 t-test 아님."
  }
];

let answered = new Array(QUESTIONS.length).fill(false);
let selected = new Array(QUESTIONS.length).fill(-1);
let studentName = "";

// 이름 입력
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
nameInput.addEventListener('input', () => {
  startBtn.disabled = nameInput.value.trim().length === 0;
});
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !startBtn.disabled) startBtn.click(); });
startBtn.addEventListener('click', () => {
  studentName = nameInput.value.trim();
  document.getElementById('overlay').style.display = 'none';
});

// 퀴즈 렌더링
const quizEl = document.getElementById('quiz');
const labels = ['A', 'B', 'C', 'D'];
let lastSec = "";
QUESTIONS.forEach((item, i) => {
  if (item.sec !== lastSec) {
    const st = document.createElement('div');
    st.className = 'section-title';
    st.textContent = item.sec;
    quizEl.appendChild(st);
    lastSec = item.sec;
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="q-head">
      <div class="q-num">${i + 1}</div>
      <div class="q-role">${item.role}</div>
    </div>
    <div class="q-text">${item.q}</div>
    <div class="opts" id="opts-${i}"></div>
    <div class="exp" id="exp-${i}">💡 ${item.exp}</div>
  `;
  quizEl.appendChild(card);

  const optsBox = card.querySelector(`#opts-${i}`);
  item.opts.forEach((opt, j) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="opt-label">${labels[j]}.</span>${opt}`;
    btn.addEventListener('click', () => choose(i, j));
    optsBox.appendChild(btn);
  });
});

function choose(qi, oi) {
  if (answered[qi]) return;
  answered[qi] = true;
  selected[qi] = oi;
  const optsBox = document.getElementById(`opts-${qi}`);
  const btns = optsBox.querySelectorAll('.opt');
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === QUESTIONS[qi].ans) b.classList.add('correct');
    else if (j === oi) b.classList.add('wrong');
  });
  document.getElementById(`exp-${qi}`).classList.add('show');
  updateProgress();
}

function updateProgress() {
  const done = answered.filter(Boolean).length;
  const total = QUESTIONS.length;
  document.getElementById('fill').style.width = (done / total * 100) + '%';
  document.getElementById('ptext').textContent = `${done} / ${total}`;
  if (done === total) finish();
}

function finish() {
  let correct = 0;
  QUESTIONS.forEach((item, i) => { if (selected[i] === item.ans) correct++; });
  const total = QUESTIONS.length;
  const pct = Math.round(correct / total * 100);

  let grade = "복습";
  if (pct >= 90) grade = "S";
  else if (pct >= 80) grade = "A";
  else if (pct >= 70) grade = "B";

  const msgMap = {
    "S": "완벽합니다! 검정 선택의 논리를 확실히 잡았어요.",
    "A": "아주 좋아요! 핵심 분기를 잘 이해하고 있습니다.",
    "B": "기본은 탄탄합니다. 헷갈린 문항의 해설을 한 번 더 보세요.",
    "복습": "괜찮아요. 강의노트 'PART A~C'와 해설을 복습해봅시다."
  };

  const res = document.getElementById('result');
  res.classList.add('show');
  document.getElementById('scoreNum').textContent = `${correct} / ${total}`;
  const gradeEl = document.getElementById('gradeText');
  gradeEl.textContent = `${grade}등급 · ${pct}점`;
  gradeEl.style.color = (grade === "복습") ? "#e67e22" : "#6c5ce7";
  document.getElementById('resultMsg').textContent = msgMap[grade];
  res.scrollIntoView({ behavior: 'smooth' });

  submitResult(correct, total, pct, grade);
}

function submitResult(correct, total, pct, grade) {
  const sel = selected.join(',');
  const cor = QUESTIONS.map(q => q.ans).join(',');
  const qtexts = QUESTIONS.map(q => q.label).join('|');
  const optexts = QUESTIONS.map((q, i) =>
    (selected[i] >= 0 ? q.opts[selected[i]] : '').slice(0, 30)
  ).join('|');

  const params = new URLSearchParams({
    name: studentName || '익명',
    week: WEEK_ID,
    correct: correct,
    total: total,
    pct: pct,
    grade: grade + "등급",
    sel: sel,
    cor: cor,
    qtexts: qtexts,
    optexts: optexts
  });

  const url = SCRIPT_URL + "?" + params.toString();
  const note = document.getElementById('submitNote');

  fetch(url, { method: 'GET', mode: 'no-cors' })
    .then(() => { note.textContent = "✅ 결과가 기록되었습니다."; })
    .catch(() => {
      // no-cors는 대개 catch되지 않지만, 폴백으로 이미지 요청 시도
      const img = new Image();
      img.src = url;
      note.textContent = "✅ 결과 전송 완료.";
    });
}
</script>
</body>
</html>
